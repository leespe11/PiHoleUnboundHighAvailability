services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: '172.28.2.3#53'
      FTLCONF_dns_dnssec: 'true'
      FTLCONF_webserver_interface_theme: 'default-dark'
      FTLCONF_webserver_port: '80o,443os,[::]:80o,[::]:443os'
    volumes:
      - /pihole/settings:/etc/pihole:rw
      - /pihole/dnsmasq.d:/etc/dnsmasq.d:rw
      - /pihole/log:/var/log/pihole-gemini:rw
    restart: unless-stopped
    #cap_add:
    #  - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    networks:
      pihole-net:
        ipv4_address: 172.28.2.2
        aliases:
          - pihole
          
  unbound:
    container_name: unbound
    image: klutchell/unbound
    volumes:
      - ./config/unbound.conf:/etc/unbound/custom.conf.d/unbound.conf
    restart: unless-stopped
    networks:
      pihole-net:
        ipv4_address: 172.28.2.3
        aliases:
          - unbound
          
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    profiles: ["master"]
    restart: unless-stopped
    depends_on:
      - pihole
    environment:
      - TZ=${TZ}
      - PRIMARY=https://${LOCAL_IP}|${PIHOLE_WEBPASSWORD}
      - REPLICAS=https://${SSH_IP}|${PIHOLE_WEBPASSWORD}
      - CLIENT_SKIP_TLS_VERIFICATION=true
      - FULL_SYNC=true
      - RUN_GRAVITY=true
      - CRON=0 * * * *

networks:
  pihole-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.2.0/24